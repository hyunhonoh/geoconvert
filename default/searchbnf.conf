[geoconvert-command]
syntax = geoconvert <x-field> <y-field>
shortdesc = Converts KATEC (Naver TM128) coordinates to WGS84 longitude/latitude.
description = Reads KATEC x and y from the two given fields and adds x_long (longitude) and y_lat (latitude). \
    Events with missing, non-numeric or out-of-range coordinates get empty x_long and y_lat.
usage = public
example1 = ... | geoconvert x y | geostats latfield=y_lat longfield=x_long count
comment1 = Convert the x and y fields and plot the points on a map.
related = geostats
tags = geo katec tm128 coordinate convert
